<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VentLab OS — PB12 yo'naltirilgan skrining (Trial 2)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  body{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(60rem 30rem at 85% -10%,rgba(56,189,248,.12),transparent),
               radial-gradient(50rem 28rem at -10% 110%,rgba(139,92,246,.12),transparent)}
  .fcard{transition:transform .18s ease,box-shadow .18s ease}
  .fcard:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(2,8,23,.6)}
  .lbtn{transition:transform .12s ease,filter .15s ease}
  .lbtn:hover{transform:scale(1.04)}
  .lbtn:active{transform:scale(.97)}
  @keyframes bubrise{0%{transform:translateY(0);opacity:0}15%{opacity:.6}100%{transform:translateY(-16px);opacity:0}}
  .bub{animation:bubrise 2.6s infinite}
  .bub.b2{animation-delay:.9s} .bub.b3{animation-delay:1.7s}
  @keyframes wave{0%,100%{transform:translateX(0);transform-origin:center}50%{transform:translateX(1.5px)}}
  .liq{animation:wave 3.2s ease-in-out infinite}
  body.night{background:#020409}
  body.night header{background:rgba(2,4,9,.92)}
  body.neon::before{background:radial-gradient(60rem 30rem at 80% -10%,rgba(74,222,128,.14),transparent),radial-gradient(50rem 28rem at -10% 110%,rgba(236,72,153,.16),transparent)}
  body.neon .fcard{border-color:rgba(103,232,249,.45)}
  .confetti{position:fixed;top:-12px;z-index:80;pointer-events:none;animation:fall 2.3s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.2}}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:#0b1220}
  ::-webkit-scrollbar-thumb{background:#2c3a52;border-radius:5px}
  .tnum{font-variant-numeric:tabular-nums}
  @keyframes pr{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
  .alertr{animation:pr 1.5s infinite}
  @keyframes pg{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}50%{box-shadow:0 0 0 12px rgba(74,222,128,0)}}
  .alertg{animation:pg 1.5s infinite}
  @keyframes pb{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.5)}50%{box-shadow:0 0 0 10px rgba(56,189,248,0)}}
  .alertb{animation:pb 1.5s infinite}
  .fadein{animation:fi .22s ease}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .stepnum{display:inline-flex;width:22px;height:22px;border-radius:7px;background:#0e7490;color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">

<header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/90 backdrop-blur">
  <div class="max-w-[1400px] mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 via-blue-500 to-violet-600 flex items-center justify-center text-xl shadow-lg shadow-cyan-900/40">🧫</div>
      <div>
        <h1 class="font-extrabold text-lg leading-tight bg-gradient-to-r from-cyan-300 to-violet-300 bg-clip-text text-transparent">VentLab OS</h1>
        <p class="text-[11px] text-slate-400 leading-tight">PB12 · Vent polimeraza · Trial 2</p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <div class="px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700"><span id="dnIcon"></span> <span id="gElapsed" class="tnum font-bold text-cyan-300">—</span></div>
      <button id="nextBtn" onclick="doNext()" class="lbtn px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-extrabold shadow-lg shadow-emerald-900/40">NEXT ▶</button>
    </div>
    <nav class="ml-auto flex flex-wrap gap-1 text-sm" id="navTabs"></nav>
    <div class="flex gap-1"><button onclick="toggleTheme()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-600 hover:bg-slate-700 text-xs" id="themeBtn" title="rejim">🎨</button><button onclick="toggleSound()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-600 hover:bg-slate-700 text-xs" id="soundBtn" title="ovoz">🔇</button><button onclick="toggleLang()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-600 hover:bg-slate-700 text-xs font-bold" id="langBtn">🌐</button></div>
  </div>
</header>

<main id="view" class="max-w-[1400px] mx-auto px-4 py-5"></main>
<div id="modalRoot"></div>
<div id="toastRoot" class="fixed bottom-4 right-4 z-[70] space-y-2"></div>

<script>
'use strict';
/* ================================================
   VENTLAB OS v3 — soddalashtirilgan, ikki tilli
   PB12 skrining yo'naltiruvchi tizimi
   ================================================ */
const LS='ventlab_os_v3';

/* ---- PB12 dizayn (qo'lyozmalar, Trial 2) ---- */
const DESIGN=[
 {run:1, gly:0.8, phos:50, iptg:0.1, temp:37, expH:24, od:1.2, mg:0,  ye:0},
 {run:2, gly:0.0, phos:50, iptg:1.0, temp:20, expH:24, od:1.2, mg:10, ye:0},
 {run:3, gly:0.8, phos:0,  iptg:1.0, temp:37, expH:4,  od:1.2, mg:10, ye:10},
 {run:4, gly:0.0, phos:50, iptg:0.1, temp:37, expH:24, od:0.4, mg:10, ye:10},
 {run:5, gly:0.0, phos:0,  iptg:1.0, temp:20, expH:24, od:1.2, mg:0,  ye:10},
 {run:6, gly:0.0, phos:0,  iptg:0.1, temp:37, expH:4,  od:1.2, mg:10, ye:0},
 {run:7, gly:0.8, phos:0,  iptg:0.1, temp:20, expH:24, od:0.4, mg:10, ye:10},
 {run:8, gly:0.8, phos:50, iptg:0.1, temp:20, expH:4,  od:1.2, mg:0,  ye:10},
 {run:9, gly:0.8, phos:50, iptg:1.0, temp:20, expH:4,  od:0.4, mg:10, ye:0},
 {run:10,gly:0.0, phos:50, iptg:1.0, temp:37, expH:4,  od:0.4, mg:0,  ye:10},
 {run:11,gly:0.8, phos:0,  iptg:1.0, temp:37, expH:24, od:0.4, mg:0,  ye:0},
 {run:12,gly:0.0, phos:0,  iptg:0.1, temp:20, expH:4,  od:0.4, mg:0,  ye:0},
];
const FACTORS=[
 {key:'gly', labelUz:'Glitserin',   labelEn:'Glycerol',       hi:0.8, lo:0.0, unit:'%'},
 {key:'phos',labelUz:'Fosfat (media)',labelEn:'Phosphate (media)',hi:50,lo:0, unit:'mM'},
 {key:'iptg',labelUz:'IPTG',        labelEn:'IPTG',           hi:1.0, lo:0.1, unit:'mM'},
 {key:'temp',labelUz:'Harorat',     labelEn:'Temperature',    hi:37,  lo:20,  unit:'°C'},
 {key:'expH',labelUz:'Ifoda vaqti (jadval)',labelEn:'Expression time (table)',hi:24, lo:4, unit:'h'},
 {key:'od',  labelUz:'OD600 maqsadi',labelEn:'OD600 target', hi:1.2, lo:0.4,  unit:''},
 {key:'mg',  labelUz:'MgSO4',       labelEn:'MgSO4',          hi:10,  lo:0,   unit:'mM'},
 {key:'ye',  labelUz:'Yeast extract (media)',labelEn:'Yeast extract (media)',hi:10,lo:0,unit:'g/L'},
];
const LABELS='ABCDEFGHIJKL';

/* ---- stoklar: faqat qo'lda qo'shiladigan moddalar.
      P va YE bazaviy muhitda allaqachon bor! ---- */
const SUBSTANCES={
 Gly: {nameUz:'Glitserin', nameEn:'Glycerol', unit:'%', def:100, hintUz:'toza = 100%', hintEn:'pure = 100%'},
 Mg:  {nameUz:'MgSO4', nameEn:'MgSO4', unit:'mM', def:1000, hintUz:'1 M = 1000 mM', hintEn:'1 M = 1000 mM'},
 IPTG:{nameUz:'IPTG',  nameEn:'IPTG', unit:'mM', def:1000, hintUz:'1 M = 1000 mM', hintEn:'1 M = 1000 mM'},
 Amp: {nameUz:'Ampitsillin', nameEn:'Ampicillin', unit:'mg/mL', def:100, hintUz:'100 mg/mL', hintEn:'100 mg/mL'},
};

/* ---- i18n ---- */
const LANG={
uz:{},
en:{}};
function fill(){
 const uz=LANG.uz, en=LANG.en;
 const D={
  tabs_steps:['Qadamlar','Steps'], tabs_flasks:['Kolbalar','Flasks'], tabs_chart:['Grafik','Chart'], tabs_fx:["Ta'sirlar",'Effects'], tabs_set:['Sozlamalar','Settings'],
  next:['NEXT ▶','NEXT ▶'],
  st_lab:["Bo'sh",'Empty'], st_grow:['O\'smoqda','Growing'], st_warn:['OD o\'lchang!','Measure OD!'], st_indc:['IPTG vaqti!','Add IPTG!'],
  st_incub:['Ishlab chiqarmoqda','Expressing'], st_harv:['Yig\'ish vaqti!','Harvest!'], st_over:['KECHIKDI!','OVERDUE!'], st_done:['Olingan ✓','Done ✓'],
  w_title:['Qadam-baqadam rejim','Step-by-step'],
  s1:['1 · Kolba ↔ run: o\'zing belgilangsiz','1 · Flask ↔ run: you assign'],
  s1_hint:['Tavakkal tartibingizni dropdown-dan tanlang — almashtirish avtomatik. Batch(A–C…)= faqat qo\'yish tartibi.','Pick your random order from the dropdown — swaps are automatic. Batches are just pipetting order.'],
  s2:['2 · Media + hujayra (batch bo\'yicha bitta tugma)','2 · Media + cells (one button per batch)'],
  prep_btn:['✔ Batch tayyorlandi — soatlar ishga tushdi','✔ Batch prepared — clocks started'],
  base_media:['Bazaviy media (10 ml, P va YE ichida)','Base media (10 mL, P & YE inside)'],
  gly_add:['glitserin','glycerol'], mg_add:['MgSO4'], amp_add:['Amp'], water_add:['suv (tenglashtirish)','water (equalize)'],
  and_then:['keyin','then'], inoc_hint:['µL hujayra — soat boshlanadi','µL cells — clock starts'],
  s3:['3 · O\'sish nazorati','3 · Growth monitor'],
  s4:['4 · IPTG qo\'shish navbati','4 · IPTG queue'],
  s5:['5 · Harvest','5 · Harvest'],
  empty_prep:['Hammasi tayyor!','All prepared!'],
  empty_grow:['Hali o\'smoqda kolba yo\'q. Yukoridagi batchlarni boshlashing.','No growing flasks yet. Prep a batch above.'],
  empty_induce:['Hali OD maqsadga yetgan kolba yo\'q.','No flask reached its OD target yet.'],
  empty_harv:['Hali induksiya yo\'q.','No inductions yet.'],
  od_title:['OD600 o\'lchash','Measure OD600'], od_btn:['✔ Yozdim','✔ Log OD'], od_lbl:['OD600 qiymati *','OD600 reading *'],
  od_sample_hint:['namuna µL avtomatik ayiriladi','sample µL auto-subtracted'], dil:['Suyultirish','Dilution'],
  wave_harvest:['Sentrifuga: 7068\u00d7g \u00b7 20 min','Centrifuge: 7068\u00d7g \u00b7 20 min'],
  concrete:['Sentrifuga qilindi: 7068\u00d7g \u00b7 20 min','Centrifuged 7068\u00d7g \u00b7 20 min'],
  harvest_done:['✔ Yig\'ildi','✔ Harvested'],
  induce_title:['IPTG qo\'shish','Add IPTG'], induce_btn:['✔ IPTG solindi — taymer ketti','✔ IPTG in — timer started'],
  iptg_qty:['Qo\'shiladigan IPTG (µL):','IPTG to add (µL):'],
  post_time:['Nechi soat turadi (h):','How long (h):'],
  weq:['+ suv tenglashtirish','+ water top-up'],
  effects_title:[' PB12 faktorlari ta\'siri (javobni har kolbaga kiriting)','PB12 factor effects (enter a response per flask)'],
  resp_lbl:['Natija (ball yoki mg/L)','Response (score or mg/L)'],
  set_stocks:['Stok konsentratsiyalari — µL hisob shular asosida','Stock concentrations — all µL computed from these'],
  set_proto:['Protokol raqamlari','Protocol numbers'],
  base_vol:['Bazaviy media / kolba (µL)','Base media / flask (µL)'],
  weq_set:['Suv tenglashtirish','Water top-up'],
  inoc_set:['Hujayra (inoculum, µL)','Inoculum (µL)'], odS_set:['OD namuna (µL)','OD sample (µL)'],
  amp_ul:['Amp / kolba (µL)','Amp / flask (µL)'], reader:['Reader limiti OD','Reader limit OD'],
  pi37:['IPTG+keyin soat @37°C','Post-IPTG h @37°C'], pi20:['IPTG+keyin soat @20°C','Post-IPTG h @20°C'],
  save:['💾 Saqlash','💾 Save'],
  export:['⬇ Zaxira (JSON)','⬇ Backup (JSON)'], imp:['⬆ Yuklash','⬆ Import'], reset:['🗑 Hammasini o\'chirish','🗑 Reset all'],
  chart_title:['OD600 o\'sish va prognoz','OD600 growth & prediction'],
  log_title:['Amallar tarixi','Audit log'],
  map_title:['Kolba↔run xarita','Flask↔run map'],
 };
 Object.keys(D).forEach(k=>{ uz[k]=D[k][0]; en[k]=D[k][1]; });
}
fill();

/* ---- state ---- */
function defaultState(){
  const stocks={}; for(const k in SUBSTANCES) stocks[k]={c:SUBSTANCES[k].def};
  return {
    version:3,
    lang:'uz',
    settings:{ baseUl:10000, inocUl:150, odSampleUl:200, ampUl:10, readerMaxOd:1.2,
               equalizeWater:true, postInd:{37:4,20:12}, order:null },
    stocks, flasks:null,
    dismissed:{}, view:'steps', selLab:'A', globalLog:[],
    randomSeed:null, randomizedAt:null,
  };
}
function t(k){ const d=LANG[S.lang]||LANG.uz; return d[k]!=null? d[k] : (LANG.uz[k]!=null? LANG.uz[k] : k); }
function tF(k){ return t(k).replace('*','').trim(); }
function tx(uz,en){ return S.lang==='en'? en : uz; }  // inline two-language strings

function initFlasks(order){
  if(!order) order=S.settings.order||DESIGN.map(d=>d.run);
  S.settings.order=order;
  S.flasks=order.map((run,i)=>({
    run, label:LABELS[i], batch:Math.floor(i/3)+1,
    step:'prep', startTs:null, totalVol:0, startTotal:0,
    additions:[], ods:[], iptgUl:null, incubTemp:null, incubH:null, incubEnds:null, inducedTs:null,
    harvested:false, harvestedTs:null, response:null, log:[]
  }));
}
function mkFlasks(){ if(!S.flasks){ initFlasks(DESIGN.map(d=>d.run)); } }
function assignRun(label,newRun){
  const a=S.flasks.find(x=>x.label===label); if(!a) return;
  if(a.step!=='prep'){ toast(tx('🔒 '+label+' allaqachon o\'smoqda — o\'zgarmaydi.','🔒 '+label+' is already growing — locked.'),'bg-red-900 border border-red-500'); return; }
  newRun=Number(newRun); const b=S.flasks.find(x=>x.run===newRun); if(!b||b.label===label){ save(); render(); return; }
  const old=a.run; a.run=newRun; b.run=old;
  logg(null,'setup', tx('Kolba '+label+' = run '+newRun+' (eski run '+old+' → kolba '+b.label+')','Flask '+label+' = run '+newRun+' (old run '+old+' → flask '+b.label+')'));
  save(); render();
}
function randomizeNow(){ const o=DESIGN.map(d=>d.run);
  for(let i=o.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; }
  initFlasks(o); S.randomizedAt=Date.now(); save(); render(); }

let S=(()=>{ try{ const raw=localStorage.getItem(LS);
  if(raw){ const s=JSON.parse(raw); if(s&&s.version===3&&s.settings&&s.flasks&&s.flasks.length===12) return s; } }
  catch(e){} return defaultState(); })();
mkFlasks();
function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function toggleLang(){ S.lang=S.lang==='uz'? 'en':'uz'; save(); render(); updateLangBtn(); }
function updateLangBtn(){ const b=document.getElementById('langBtn'); if(b) b.textContent='🌐 '+(S.lang==='uz'?'UZ':'EN'); }

const $=s2=>document.querySelector(s2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n1=n=>Number(n).toFixed(1), n2=n=>Number(n).toFixed(2);
const now=()=>Date.now();
function hms(ms){ if(ms<0)ms=0; const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fL(label){ return S.flasks.find(x=>x.label===label); }
function fR(runN){ return S.flasks.find(x=>x.run===Number(runN)); }
function M(fl){ return DESIGN[fl.run-1]; }
function sumAdd(fl,sub){ return fl.additions.filter(a=>a.sub===sub).reduce((t,a)=>t+a.ul,0); }
function lastOd(fl){ return fl.ods.length? fl.ods[fl.ods.length-1]:null; }
function effOd(o){ return o.od*o.dil; }
function logg(fl,type,text){ const e={ts:now(), label:fl?fl.label:null, run:fl?fl.run:null, type, text};
  S.globalLog.push(e); if(fl) fl.log.push(e); save(); }

/* ---- retsept: bazaviy 10 ml + Gly/Mg/Amp + suv tenglashtirish.
      FOSFAT va YE bazaviy muhitda bor — qo'shilmaydi! ---- */
function supRows(){ const rows={}; let maxSum=0;
  S.flasks.forEach(fl=>{ const m=M(fl), Tk=S.settings.baseUl;
    const Gly=m.gly>0? Math.round(m.gly*Tk/S.stocks.Gly.c):0;
    const Mg =m.mg>0 ? Math.round(m.mg *Tk/S.stocks.Mg.c):0;
    const r={Gly, Mg, sum:Gly+Mg}; rows[fl.label]=r; if(r.sum>maxSum) maxSum=r.sum; });
  return {rows,maxSum}; }
function recipe(fl){ const st=S.settings, sr=supRows(), r=sr.rows[fl.label];
  r.Water= st.equalizeWater? (sr.maxSum-r.sum):0;
  r.Amp=st.ampUl; r.base=st.baseUl; r.inoc=st.inocUl;
  r.finalVol = r.base + r.Gly + r.Mg + r.Water + r.Amp + r.inoc; // hamma kolbada bir xil
  return r; }
function iptgUlFor(fl){ return M(fl).iptg * fl.totalVol / (S.stocks.IPTG.c||1); }
function waterEqUl(fl,iu){ const mx=1.0*fl.totalVol/S.stocks.IPTG.c; return Math.max(0, mx-(iu!=null?iu:iptgUlFor(fl))); }
function iptgMmNow(fl){ return S.stocks.IPTG.c*sumAdd(fl,'IPTG')/Math.max(fl.totalVol,1); }
function mediaTypes(){ const g={};
  S.flasks.forEach(fl=>{ const m=M(fl); const k=m.phos+'|'+m.ye;
    (g[k]=g[k]||{phos:m.phos, ye:m.ye, flasks:[]}).flasks.push(fl); });
  return Object.values(g).sort((a,b)=>a.flasks.length-b.flasks.length); }

/* =================== STATUS / PROGNOZ / NAVBAT =================== */
const ST={
 lab:  {liq:'#334155'}, grow:{liq:'#0ea5e9'}, warn:{liq:'#facc15'}, indc:{liq:'#4ade80'},
 incub:{liq:'#a78bfa'}, harv:{liq:'#fb923c'}, over:{liq:'#ef4444'}, done:{liq:'#059669'},
};
function stBadge(st){ const cls={lab:'bg-slate-800 text-slate-300 border border-slate-600', grow:'bg-sky-900/70 text-sky-300 border border-sky-600',
 warn:'bg-yellow-900/60 text-yellow-300 border border-yellow-600', indc:'bg-green-900/70 text-green-300 border border-green-500',
 incub:'bg-violet-900/70 text-violet-300 border border-violet-600', harv:'bg-orange-900/70 text-orange-300 border border-orange-500',
 over:'bg-red-900/70 text-red-300 border border-red-500', done:'bg-emerald-900/60 text-emerald-300 border border-emerald-600'}[st];
 const key={lab:'st_lab',grow:'st_grow',warn:'st_warn',indc:'st_indc',incub:'st_incub',harv:'st_harv',over:'st_over',done:'st_done'}[st];
 return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold '+cls+'">'+t(key)+'</span>'; }
function ozdReached(fl){ const lo=lastOd(fl); return lo && effOd(lo)>=M(fl).od-0.001; }
function status(fl){
  if(fl.step==='prep') return 'lab';
  if(fl.harvested) return 'done';
  if(fl.step==='induced') return (fl.incubEnds&&now()>=fl.incubEnds)?'harv':'incub';
  if(ozdReached(fl)) return 'indc';
  if(overdue(fl)) return 'over';
  if(measureDue(fl)) return 'warn';
  return 'grow';
}
function overdue(fl){ if(fl.step!=='growth') return false; const p=predictHit(fl);
  return p && now()>p+2*3.6e6; }
function growRate(fl){ const pts=fl.ods.filter(o=>effOd(o)>0);
  if(pts.length>=2){ const lns=pts.map(o=>({x:(o.ts-fl.startTs)/3.6e6, y:Math.log(effOd(o))}));
    const n=lns.length, mx=lns.reduce((tt,p)=>tt+p.x,0)/n, my=lns.reduce((tt,p)=>tt+p.y,0)/n;
    let num=0,den=0; lns.forEach(p=>{num+=(p.x-mx)*(p.y-my); den+=(p.x-mx)**2;});
    const mu=den>1e-9?num/den:NaN;
    if(isFinite(mu)&&mu>0.1&&mu<3.5) return mu; }
  return 0.9; }  // fallback growth rate @ 37°C (pre-IPTG)
function estGrowthH(odT){
  return odT>1? 4:2.5;   // 37°C (hammasi IPTG gacha 37°C da o\'sadi; handwriting: OD 0.4 ~2.5h)
}
function predictHit(fl){ const m=M(fl);
  if(fl.step==='prep') return null;
  const lo=lastOd(fl); if(!lo||effOd(lo)<=0) return fl.startTs+estGrowthH(m.od)*3.6e6;
  const mu=growRate(fl), d=Math.log(m.od/effOd(lo));
  return lo.ts+(d>0?d/mu:0)*3.6e6; }

function drawOd(fl,m){ if(typeof Chart==='undefined') return; const el=$('#odChart'); if(!el) return;
  if(odChart){odChart.destroy();odChart=null;}
  const pts=fl.startTs? fl.ods.map(o=>({x:(o.ts-fl.startTs)/3.6e6,y:effOd(o)})):[];
  const mu=growRate(fl); let pred=[];
  if(pts.length){ const p0=pts[0], tEnd=(now()-fl.startTs)/3.6e6+2;
    const tTar=p0.x+Math.log(m.od/p0.y)/mu; const tMax=Math.max(tEnd,tTar+1);
    for(let tt=p0.x; tt<=tMax; tt+=Math.max(0.1,(tMax-p0.x)/40)) pred.push({x:tt,y:Math.min(p0.y*Math.exp(mu*(tt-p0.x)),m.od*1.15)}); }
  odChart=new Chart(el,{data:{datasets:[
    {type:'line',label:'OD',data:pts,showLine:true,borderColor:'#22d3ee',backgroundColor:'rgba(34,211,238,.2)',pointRadius:5,tension:.25,fill:true},
    {type:'line',label:tx('prognoz','prediction'),data:pred,borderColor:'#94a3b8',borderDash:[5,5],pointRadius:0},
    {type:'line',label:tx('maqsad','target')+' '+m.od,data:[{x:0,y:m.od},{x:m.expH+4,y:m.od}],borderColor:'#4ade80',borderDash:[8,6],pointRadius:0},
    {type:'line',label:tx('reader limiti','reader limit'),data:[{x:0,y:S.settings.readerMaxOd},{x:m.expH+4,y:S.settings.readerMaxOd}],borderColor:'#ef4444',borderDash:[2,5],pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
     scales:{x:{type:'linear',title:{display:true,text:'h'},ticks:{color:'#94a3b8'},grid:{color:'#1e293b'}},y:{beginAtZero:true,suggestedMax:1.5,ticks:{color:'#94a3b8'},grid:{color:'#1e293b'}}},
     plugins:{legend:{labels:{color:'#cbd5e1',boxWidth:12}}}}});
}

   '<p class="text-xs text-slate-400 mb-2">'+tx('Har yig\'ilgan kolbaga bitta natija kiriting (ball 0–100 yoki mg/L). '+n+'/12 kiritilgan. Ishonchli xulosa uchun 12/12 bo\'lishi kerak.','Enter one response per harvested flask (score 0–100 or mg/L). '+n+'/12 entered. All 12 needed for solid conclusions.')+'</p>'+
   (rows.length?'<table class="w-full text-xs tnum"><tr class="text-left text-slate-400"><th class="px-2 py-1">'+tx('Faktor','Factor')+'</th><th class="px-2 py-1">'+tx('Ta\'sir','Effect')+'</th></tr>'+
    rows.map(r=>'<tr class="border-t border-slate-800"><td class="px-2 py-1">'+r.label+'</td><td class="px-2 py-1"><b class="'+(r.e>0?'text-green-400':'text-red-400')+'">'+(r.e>=0?'+':'')+n2(r.e)+'</b></td></tr>').join('')+'</table>'
    :'<p class="text-xs text-slate-500">…</p>')+
   '<div class="h-64 mt-3"><canvas id="fxChart"></canvas></div></div>'+
   '<div class="rounded-2xl border border-slate-700 bg-slate-900/80 p-4"><h3 class="font-bold mb-2 text-sm">'+t('resp_lbl')+'</h3>'+
   '<table class="w-full text-xs"><tr class="text-left text-slate-400"><th class="px-2 py-1">'+tx('Kolba','Flask')+'</th><th class="px-2 py-1">'+tx('Dizayn','Design')+'</th><th class="px-2 py-1">'+tx('Holat','Status')+'</th><th class="px-2 py-1">'+t('resp_lbl')+'</th></tr>'+inp+'</table></div></div>';
  const el=$('#fxChart'); if(el&&typeof Chart!=='undefined'&&rows.length){
    if(fxChart){fxChart.destroy();fxChart=null;}
    fxChart=new Chart(el,{type:'bar',data:{labels:rows.map(r=>r.label),datasets:[{data:rows.map(r=>+n2(r.e)),backgroundColor:rows.map(r=>r.e>0?'rgba(74,222,128,.8)':'rgba(239,68,68,.8)')}]},
     options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'#1e293b'}},y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'#1e293b'}}}}});
  }
}
function setResp(runN,v){ fR(runN).response=v===''?null:parseFloat(v); save();
  const c=document.getElementById('respCount'); if(c) c.textContent=n2(0); render(); }

/* ---- SOZLAMALAR ---- */
function renderSet(){
  const st=S.settings;
  const rows=S.globalLog.slice().reverse().slice(0,50).map(e=>'<tr class="border-t border-slate-800"><td class="px-2 py-1 text-[11px] text-slate-500 tnum">'+new Date(e.ts).toLocaleTimeString()+'</td>'+
   '<td class="px-2 py-1 text-xs">'+(e.label?'<b>'+e.label+'</b> ':'')+esc(e.text)+'</td></tr>').join('');
  $('#view').innerHTML='<div class="max-w-2xl mx-auto space-y-4 fadein">'+
   '<div class="rounded-2xl border border-slate-700 bg-slate-900/80 p-4 space-y-3">'+
    '<h2 class="font-bold">⚙ '+t('set_stocks')+'</h2>'+
    '<div class="grid grid-cols-2 gap-2 text-sm">'+Object.keys(SUBSTANCES).map(k=>{
      const s2=SUBSTANCES[k];
      return '<label class="rounded-xl bg-slate-800/60 border border-slate-700 p-2 block text-xs">'+(S.lang==='en'?s2.nameEn:s2.nameUz)+' ('+s2.unit+')'+
      '<input class="inv-in w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 tnum" data-stk="'+k+'" type="number" value="'+(S.stocks[k]?S.stocks[k].c:s2.def)+'"></label>'; }).join('')+'</div>'+
    '<h3 class="font-bold pt-1">'+t('set_proto')+'</h3>'+
    '<div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">'+
     '<label>'+t('base_vol')+'<input class="inv-in w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 tnum" data-set="baseUl" type="number" value="'+st.baseUl+'"></label>'+
     '<label>'+t('inoc_set')+'<input class="inv-in w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 tnum" data-set="inocUl" type="number" value="'+st.inocUl+'"></label>'+
     '<label>'+t('odS_set')+'<input class="inv-in w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 tnum" data-set="odSampleUl" type="number" value="'+st.odSampleUl+'"></label>'+
     '<label>'+t('amp_ul')+'<input class="inv-in w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 tnum" data-set="ampUl" type="number" value="'+st.ampUl+'"></label>'+
     '<label>'+t('reader')+'<input class="inv-in w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 tnum" data-set="readerMaxOd" type="number" step="any" value="'+st.readerMaxOd+'"></label>'+
     '<label class="flex items-center gap-2 pt-4">'+t('weq_set')+'<input class="inv-in w-4 h-4" data-set="equalizeWater" type="checkbox" '+(st.equalizeWater?'checked':'')+'></label>'+
     '<label>'+t('pi37')+'<input class="inv-in w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 tnum" data-set="pi37" type="number" value="'+postIndH(37)+'"></label>'+
     '<label>'+t('pi20')+'<input class="inv-in w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-2 py-1.5 tnum" data-set="pi20" type="number" value="'+postIndH(20)+'"></label>'+
    '</div>'+
    '<button onclick="saveInv()" class="px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 font-bold">'+t('save')+'</button>'+
   '</div>'+
   '<div class="rounded-2xl border border-slate-700 bg-slate-900/80 p-4 space-y-2">'+
    '<div class="flex flex-wrap gap-2">'+
    '<button onclick="exportJson()" class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-600 hover:bg-slate-700 text-xs">'+t('export')+'</button>'+
    '<label class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-600 hover:bg-slate-700 text-xs cursor-pointer">'+t('imp')+'<input type="file" accept=".json" class="hidden" onchange="importJson(this)"></label>'+
    '<button onclick="resetAll()" class="px-3 py-2 rounded-xl bg-red-900 border border-red-600 hover:bg-red-800 text-xs">'+t('reset')+'</button></div>'+
    '<p class="text-[11px] text-slate-400">'+tx('Har amaldan keyin brauzerda avtomatik saqlanadi. Brauzer tozalanishidan oldin zaxira oling.','Autosaves to browser after every action. Export before clearing browser data.')+'</p></div>'+
   '<div class="rounded-2xl border border-slate-700 bg-slate-900/80 p-4"><h3 class="font-bold mb-2 text-sm">🧾 '+t('log_title')+'</h3><table class="w-full">'+(rows||'')+'</table></div>'+
   '<div class="rounded-2xl border border-slate-700 bg-slate-900/80 p-4"><h3 class="font-bold mb-2 text-sm">📐 PB12 jadvali ('+tx('tizimda aynan shunday — 6 yuqori / 6 past, balanslangan','stored exactly as given — balanced 6 high / 6 low')+')</h3>'+
    '<table class="w-full text-[11px] tnum"><tr class="text-slate-400 text-left"><th class="px-1 py-1">run</th><th class="px-1 py-1">gly%</th><th class="px-1 py-1">P</th><th class="px-1 py-1">IPTG</th><th class="px-1 py-1">degC</th><th class="px-1 py-1">jadval·h</th><th class="px-1 py-1">OD</th><th class="px-1 py-1">Mg</th><th class="px-1 py-1">YE</th><th class="px-1 py-1">+IPTG</th></tr>'+
    DESIGN.map(md=>'<tr class="border-t border-slate-800"><td class="px-1 py-1">'+md.run+'</td><td class="px-1 py-1">'+md.gly+'</td><td class="px-1 py-1">'+md.phos+'</td><td class="px-1 py-1">'+md.iptg+'</td><td class="px-1 py-1 '+(md.temp>=30?'text-red-300 font-bold':'text-blue-300 font-bold')+'">'+md.temp+'</td><td class="px-1 py-1">'+md.expH+'</td><td class="px-1 py-1">'+md.od+'</td><td class="px-1 py-1">'+md.mg+'</td><td class="px-1 py-1">'+md.ye+'</td><td class="px-1 py-1">'+postIndH(md.temp)+'h</td></tr>').join('')+'</table></div>'+
    '<div class="text-[10px] text-amber-300 mt-1">'+tx('⚠ jadval·h = IPTG dan keyingi ifoda vaqti (qo\'lyozmadan). 24h uzoq → amalda 12h @20°C / 4h @37°C. OD ga yetish vaqti esa MODEL BASHORATI (2+ o\'lchovdan keyin aniqroq).','table·h = post-IPTG expression time (from notes). 24h is long → practice: 12h @20°C / 4h @37°C. Time-to-OD is a model estimate (better after 2+ readings).')+'</div>'+
   '<div class="rounded-2xl border border-slate-700 bg-slate-900/80 p-4"><h3 class="font-bold mb-2 text-sm">🗺 '+t('map_title')+'</h3>'+
    '<div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-2 mome text-xs">'+
    mediaTypes().map((g,i)=>'<div class="rounded-xl border border-slate-700 p-2">M'+(i+1)+': '+g.phos+' mM P · '+g.ye+' g/L YE<br><span class="text-slate-400">'+g.flasks.map(f2=>f2.label).join(', ')+'</span></div>').join('')+
    '</div></div>'+
   '</div>';
}
function saveInv(){ document.querySelectorAll('.inv-in').forEach(el=>{
    const stk=el.getAttribute('data-stk'); const k=el.getAttribute('data-set');
    if(k==='equalizeWater'){ S.settings.equalizeWater=el.checked; return; }
    const v=parseFloat(el.value); if(isNaN(v)) return;
    if(stk) S.stocks[stk].c=v;
    else if(k==='pi37') S.settings.postInd[37]=v;
    else if(k==='pi20') S.settings.postInd[20]=v;
    else S.settings[k]=v; });
  save(); toast('💾 '+tx('Saqlandi','Saved')); render(); }
function exportJson(){ const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='ventlab-v3.json'; a.click(); }
function importJson(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.flasks||s.version!==3) throw 0; S=s; save(); toast('✅'); render(); }catch(e){ toast('⚠','bg-red-900'); } }; r.readAsText(f); }
function resetAll(){ if(confirm(tx('HAMMASI o\'chiriladi. Ishonchingiz komilmi?','Delete EVERYTHING. Sure?'))&&confirm(tx('Bildim-aytdim?','Really?'))){ localStorage.removeItem(LS); S=defaultState(); initFlasks(DESIGN.map(d=>d.run)); save(); render(); } }

/* ---- REJIMLAR: theme / sound / confetti ---- */
function applyTheme(){ const names=['','night','neon']; document.body.className='bg-slate-950 text-slate-100 min-h-screen '+(names[S.settings.theme||0]||'');
  const b=document.getElementById('themeBtn'); if(b){ b.innerHTML=['🎨 kunduz','🌙 tun','⚡ neon'][(S.settings.theme||0)%3]; } }
function toggleTheme(){ S.settings.theme=((S.settings.theme||0)+1)%3; save(); applyTheme(); }
function toggleSound(){ S.settings.sound=!S.settings.sound; save(); applySound(); }
function applySound(){ const b=document.getElementById('soundBtn'); if(b){ b.innerHTML=S.settings.sound?'🔊':'🔇'; } }
function beep(freq,dur,vol){ if(!S.settings.sound) return; try{ beep.ctx=beep.ctx||new (window.AudioContext||window.webkitAudioContext)();
  const o=beep.ctx.createOscillator(), g=beep.ctx.createGain(); o.frequency.value=freq; o.type='sine';
  g.gain.value=vol||0.04; o.connect(g); g.connect(beep.ctx.destination); o.start(); setTimeout(()=>{o.stop();},dur||180); }catch(e){} }
function critBeep(){ beep(880,160); setTimeout(()=>beep(660,200),200); }
function confetti(){ const colors=['#22d3ee','#4ade80','#f472b6','#facc15','#a78bfa'];
  for(let i=0;i<28;i++){ const c=document.createElement('span'); c.className='confetti';
    c.style.left=(Math.random()*100)+'vw'; c.style.background=colors[i%5];
    c.style.width=c.style.height=(5+Math.random()*7)+'px'; c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),3200); } }
/* ---- YUQORI PANEL / TICK ---- */
function updateTop(){ const es=S.flasks.filter(x=>x.startTs); const t0=es.length?Math.min(...es.map(x=>x.startTs)):null;
  $('#gElapsed').innerHTML=t0?hms(now()-t0):'—';
  const hr=new Date().getHours(); const dn=$('#dnIcon'); if(dn) dn.innerHTML=(hr>=6&&hr<19)?'☀️':'🌙'; }
let lastST=null;
function tick(){ updateTop();
  if(modalOpen) return;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')) return;
  document.querySelectorAll('[data-live]').forEach(el=>{ const fl=fL(el.getAttribute('data-live')); if(fl) el.innerHTML=liveInfo(fl); });
  const strip=$('#alertStrip');
  if(strip){ const k=stripKey(); if(k!==lastAlertKey){ const before=(S.alertCritCount||0); const cr=alerts().filter(a=>a.lvl==='crit').length;
     strip.innerHTML=stripHtml(); lastAlertKey=k; S.alertCritCount=cr; if(cr>before) critBeep(); } }
  let dirty=false;
  S.flasks.forEach(fl=>{ const st=status(fl); if(lastST[fl.label]!==st) dirty=true; });
  if(dirty) render();
}
function destroy(){ if(odChart){odChart.destroy();odChart=null;} if(fxChart){fxChart.destroy();fxChart=null;} }
function render(){ destroy();
  lastST={}; S.flasks.forEach(fl=>lastST[fl.label]=status(fl));
  renderNav(); updateLangBtn();
  if(S.view==='steps') renderSteps();
  else if(S.view==='flasks') renderFlasks();
  else if(S.view==='chart') renderChart();
  else if(S.view==='fx') renderFx();
  else if(S.view==='set') renderSet();
  updateTop(); }

/* ---- INIT ---- */
lastST={}; S.flasks.forEach(fl=>lastST[fl.label]=status(fl));
applyTheme(); applySound();
render();
setInterval(tick,1000);
console.log('VentLab OS v3 ready.');

</script>
